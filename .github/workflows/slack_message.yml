name: Send Slack Message

on:
  schedule:
    # GitHub Actions의 schedule은 best-effort라 가끔 스킵됨.
    # 하루에 3번 시도해서 누락 확률을 낮춤. 중복 발송은 send_message.py에서 방지.
    - cron: '0 0 * * *'   # KST 09:00
    - cron: '0 3 * * *'   # KST 12:00 (백업)
    - cron: '0 6 * * *'   # KST 15:00 (백업)
  workflow_dispatch:
    inputs:
      force_day:
        description: '강제로 보낼 날짜(5/10/15/20)'
        required: false

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install slack_sdk python-dotenv

      - name: Run
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          # 필요하면 채널도 시크릿/변수로 관리
          # SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          FORCE_DAY: ${{ github.event.inputs.force_day }}
        run: python send_message.py
